apply plugin: 'com.android.application'
apply plugin: 'androidx.baselineprofile'

def releaseStoreFile = System.getenv("NEWSNOOK_KEYSTORE_FILE")
def releaseStorePassword = System.getenv("NEWSNOOK_KEYSTORE_PASSWORD")
def releaseKeyAlias = System.getenv("NEWSNOOK_KEY_ALIAS")
def releaseKeyPassword = System.getenv("NEWSNOOK_KEY_PASSWORD")
def hasReleaseSigning = [releaseStoreFile, releaseStorePassword, releaseKeyAlias, releaseKeyPassword].every { it }
// Fork lock: only distribution tasks require a production key. A profile generation
// task mentions "Release" but builds benchmarkRelease/nonMinifiedRelease with local
// debug signing, and must never ask for a production keystore.
def isReleaseBuild = gradle.startParameter.taskNames.any { taskPath ->
    def name = taskPath.tokenize(':').last()
    name ==~ /(?i)(?:assemble|bundle|publish|package)(?:cloud|local)?release(?:.*)?/
}

if (isReleaseBuild && !hasReleaseSigning) {
    throw new GradleException(
        "Release signing is not configured. Run `npm run android:keystore:init` or provide NEWSNOOK_KEYSTORE_* environment variables."
    )
}

// 唯一版本源：web/package.json 的 "version"（与产物文件名 newsnook-<ver>-release.* 一致）。
// 本 Fork 只发正式版 X.Y.Z；versionCode 沿用 Fork 序列 X*10000 + Y*100 + Z，
// 与 scripts/release-contract.mjs 的 X.Y.Z-beta.N 规则不同，不要混用。
def packageJsonFile = file("../../package.json")
if (!packageJsonFile.exists()) {
    throw new GradleException("package.json not found at ${packageJsonFile.canonicalPath}")
}
def packageJson = new groovy.json.JsonSlurper().parseText(packageJsonFile.getText('UTF-8'))
def packageVersion = (packageJson.version ?: '').toString().trim()
if (!(packageVersion ==~ /^\d+\.\d+\.\d+/)) {
    throw new GradleException("package.json version must start with semver X.Y.Z, got: ${packageVersion}")
}
def semverCore = (packageVersion =~ /^(\d+)\.(\d+)\.(\d+)/)[0]
def derivedVersionCode =
    (semverCore[1] as int) * 10000 + (semverCore[2] as int) * 100 + (semverCore[3] as int)
// 仅当 Play 需要「同名 versionName 再提一次 versionCode」时才用环境变量覆盖
def appVersionCode = Integer.parseInt(System.getenv("NEWSNOOK_VERSION_CODE") ?: "${derivedVersionCode}")
def appVersionName = System.getenv("NEWSNOOK_VERSION_NAME") ?: packageVersion
// Fork lock: GitHub Actions passes one ABI per APK so each Release asset can be installed directly.
def requestedAbi = (findProperty("newsnookAbi") ?: "").toString().trim()
def supportedReleaseAbis = ["arm64-v8a", "armeabi-v7a", "x86_64"]
if (requestedAbi && !supportedReleaseAbis.contains(requestedAbi)) {
    throw new GradleException("Unsupported newsnookAbi '${requestedAbi}'. Expected one of: ${supportedReleaseAbis.join(', ')}")
}

android {
    namespace = "com.aizeek.newsnook"
    compileSdk = rootProject.ext.compileSdkVersion
    // MainActivity / NewsNookApplication gate diagnostics on BuildConfig.STARTUP_BENCHMARK.
    buildFeatures {
        buildConfig true
    }
    flavorDimensions += "translation"
    productFlavors {
        // 不链接 ML Kit / Bergamot：适合默认分发，保留云翻译。
        cloud {
            dimension "translation"
            externalNativeBuild {
                cmake {
                    arguments "-DENABLE_BERGAMOT=OFF"
                }
            }
        }
        // 链接 ML Kit + Bergamot/Marian：提供模型下载和完全离线翻译。
        local {
            dimension "translation"
            // Bergamot/Marian 依赖 bionic iconv 与 glob（API 28+）
            minSdkVersion 28
            externalNativeBuild {
                cmake {
                    abiFilters "arm64-v8a"
                    arguments "-DANDROID_STL=c++_shared", "-DENABLE_BERGAMOT=ON"
                }
            }
        }
    }
    defaultConfig {
        applicationId "com.aizeek.newsnook"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // Production must not expose the technical readiness marker used by Macrobenchmark.
        buildConfigField 'boolean', 'STARTUP_BENCHMARK', 'false'
        ndk {
            if (requestedAbi) {
                abiFilters requestedAbi
            } else {
                supportedReleaseAbis.each { abiFilters it }
            }
        }
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://github.com/google/material-design-icons/blob/master/android/AndroidManifest.xml
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    externalNativeBuild {
        cmake {
            path = file("src/local/cpp/CMakeLists.txt")
            version = "3.22.1"
        }
    }
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile = file(releaseStoreFile)
                storePassword = releaseStorePassword
                keyAlias = releaseKeyAlias
                keyPassword = releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig = signingConfigs.release
            }
            minifyEnabled = true
            shrinkResources = true
            // R8 optimizer, not only DEX shrinking/obfuscation.
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        // Manually declared profile variants must inherit release themselves:
        // the baseline profile plugin does not copy minify/shrink settings into
        // existing types. Both stay non-debuggable and need no production key.
        benchmarkRelease {
            initWith release
            buildConfigField 'boolean', 'STARTUP_BENCHMARK', 'true'
            applicationIdSuffix '.benchmark'
            signingConfig signingConfigs.debug
            matchingFallbacks = ['release']
        }
        nonMinifiedRelease {
            initWith release
            minifyEnabled = false
            shrinkResources = false
            buildConfigField 'boolean', 'STARTUP_BENCHMARK', 'true'
            applicationIdSuffix '.benchmark'
            signingConfig signingConfigs.debug
            matchingFallbacks = ['release']
        }
    }
    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
}

// Keep routine GitHub/CLI releases deterministic: the generated profile is
// checked into src/main/generated/baselineProfiles; generation is explicit.
baselineProfile {
    mergeIntoMain true
    saveInSrc true
    automaticGenerationDuringBuild false
}

// cloud flavor 不需要原生引擎；禁用其 CMake/Ninja 任务以免空跑。
afterEvaluate {
    tasks.matching { task ->
        def name = task.name.toLowerCase()
        (name.contains("externalnativebuild") || name.contains("cmake")) && name.contains("cloud")
    }.configureEach { task ->
        task.enabled = false
    }
}

// 同一个标准 GDIFF 编解码器同时用于 Android 和发版流水线，避免双端实现漂移。
configurations {
    updateDeltaTool
}

tasks.register('generateUpdateDelta', JavaExec) {
    classpath = configurations.updateDeltaTool
    mainClass = 'com.nothome.delta.Delta'
    doFirst {
        args project.property('deltaSource'), project.property('deltaTarget'), project.property('deltaOutput')
    }
}

tasks.register('applyUpdateDelta', JavaExec) {
    classpath = configurations.updateDeltaTool
    mainClass = 'com.nothome.delta.GDiffPatcher'
    doFirst {
        args project.property('deltaSource'), project.property('deltaPatch'), project.property('deltaOutput')
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    // Required for sideloaded APK distribution to apply compiled ART profiles.
    implementation 'androidx.profileinstaller:profileinstaller:1.4.1'
    baselineProfile project(':baselineprofile')
    // LinuxDoUserApiAuth uses CustomTabsIntent.
    implementation "androidx.browser:browser:1.8.0"
    implementation "com.squareup.okhttp3:okhttp:$okhttpVersion"
    implementation project(':capacitor-android')
    // 设备上仅执行 GDIFF patch；生成器依赖的 Trove 不应进入任何 APK。
    implementation('com.nothome:javaxdelta:2.0.1') {
        exclude group: 'trove', module: 'trove'
    }
    testImplementation 'trove:trove:1.0.2'
    updateDeltaTool 'com.nothome:javaxdelta:2.0.1'
    localImplementation 'com.google.mlkit:translate:17.0.3'
    testImplementation "junit:junit:$junitVersion"
    testImplementation "org.robolectric:robolectric:4.14.1"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
