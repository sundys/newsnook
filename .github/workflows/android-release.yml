name: Android Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      NEWSNOOK_KEYSTORE_PASSWORD: ${{ secrets.NEWSNOOK_KEYSTORE_PASSWORD }}
      NEWSNOOK_KEY_ALIAS: ${{ secrets.NEWSNOOK_KEY_ALIAS }}
      NEWSNOOK_KEY_PASSWORD: ${{ secrets.NEWSNOOK_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 cmake;3.22.1'

      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          echo "tag=${GITHUB_REF_NAME} package.json=${PKG_VERSION}"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} must match package.json version ${PKG_VERSION} (got ${TAG_VERSION})."
            exit 1
          fi

      - name: Restore release keystore
        env:
          NEWSNOOK_KEYSTORE_BASE64: ${{ secrets.NEWSNOOK_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$NEWSNOOK_KEYSTORE_BASE64" ]; then
            echo "::error::Secret NEWSNOOK_KEYSTORE_BASE64 is missing."
            exit 1
          fi
          for name in NEWSNOOK_KEYSTORE_PASSWORD NEWSNOOK_KEY_ALIAS NEWSNOOK_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret ${name} is missing."
              exit 1
            fi
          done
          KEYSTORE_PATH="${RUNNER_TEMP}/newsnook-release.jks"
          printf '%s' "$NEWSNOOK_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          echo "NEWSNOOK_KEYSTORE_FILE=${KEYSTORE_PATH}" >> "$GITHUB_ENV"
          echo "Restored keystore to ${KEYSTORE_PATH}"

      - name: Install npm dependencies
        run: npm ci

      - name: Initialize Bergamot native engine
        run: npm run bergamot:init

      # Fork lock: the build script invokes Gradle once per ABI and keeps APK assets separate.
      - name: Build signed ABI-specific APKs
        run: npm run android:apk

      - name: Build signed AABs (cloud + local)
        run: npm run android:aab

      - name: List artifacts
        run: ls -lh artifacts/android/

      # Fork lock: release notes body is provided per tag at .github/release-notes/<tag>.md.
      - name: Prepare release notes body
        run: |
          NOTES_FILE=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$NOTES_FILE" ]; then
            cp "$NOTES_FILE" "${RUNNER_TEMP}/release-notes.md"
          else
            echo "本次未提供独立更新摘要，请参考下方变更列表。" > "${RUNNER_TEMP}/release-notes.md"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: ${{ runner.temp }}/release-notes.md
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/android/newsnook-*-cloud-arm64-v8a-release.apk
            artifacts/android/newsnook-*-cloud-armeabi-v7a-release.apk
            artifacts/android/newsnook-*-cloud-x86_64-release.apk
            artifacts/android/newsnook-*-local-arm64-v8a-release.apk
            artifacts/android/newsnook-*-cloud-release.aab
            artifacts/android/newsnook-*-local-release.aab

      # Fork lock: guarantee the per-tag notes body lands on the release page even if
      # body_path above is ignored (e.g. when updating an existing draft release).
      - name: Apply release notes body
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          NOTES_FILE="${RUNNER_TEMP}/release-notes.md"
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          curl -sf -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "${API}/releases/tags/${GITHUB_REF_NAME}" -o "${RUNNER_TEMP}/release.json"
          RELEASE_ID="$(jq -r '.id' "${RUNNER_TEMP}/release.json")"
          CURRENT_BODY="$(jq -r '.body // ""' "${RUNNER_TEMP}/release.json")"
          FIRST_LINE="$(head -n 1 "${NOTES_FILE}")"
          if printf '%s' "${CURRENT_BODY}" | grep -qF "${FIRST_LINE}"; then
            echo "Release body already contains the notes; nothing to do."
            exit 0
          fi
          jq -n --arg notes "$(cat "${NOTES_FILE}")" --arg existing "${CURRENT_BODY}" \
            '{body: (if $existing == "" then $notes else $notes + "\n\n---\n\n" + $existing end)}' \
            > "${RUNNER_TEMP}/release-patch.json"
          curl -sf -X PATCH -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "${API}/releases/${RELEASE_ID}" -d @"${RUNNER_TEMP}/release-patch.json" > /dev/null
          echo "Release body updated."
